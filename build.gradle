plugins {
    id 'java'
    id 'war'
}

group = 'com.example'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

war {
    archiveFileName = 'TestSborka-1.0.0.war'
}

dependencies {
    implementation 'org.springframework:spring-webmvc:6.2.10'
    implementation 'org.springframework:spring-context:6.2.10'
    implementation 'org.springframework:spring-orm:6.2.10'
    implementation 'org.springframework:spring-web:6.2.10'

    implementation 'org.hibernate:hibernate-core:6.5.2.Final'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    implementation 'org.glassfish:jakarta.el:4.0.2'

    implementation 'org.postgresql:postgresql:42.7.7'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'

    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'ch.qos.logback:logback-classic:1.5.13'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation 'org.springframework:spring-websocket:6.0.11'
    implementation 'org.springframework:spring-messaging:6.0.11'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    implementation 'org.hibernate.validator:hibernate-validator:8.0.2.Final'
    implementation 'org.glassfish:jakarta.el:4.0.2'

    implementation 'software.amazon.awssdk:s3:2.20.162'

    implementation 'org.hibernate.orm:hibernate-jcache:6.5.2.Final'
    implementation('org.ehcache:ehcache:3.10.8') {
        capabilities {
            requireCapability('org.ehcache:ehcache-jakarta')
        }
    }

    // Jakarta XML Bind (required for Ehcache XML configuration)
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.3'

    implementation 'org.springframework:spring-aop:6.2.10'
    implementation 'org.aspectj:aspectjweaver:1.9.21'
    implementation 'org.aspectj:aspectjrt:1.9.21'
}